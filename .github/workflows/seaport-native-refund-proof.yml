name: Seaport native refund proof
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Public runner probe
        run: |
          set -euo pipefail
          mkdir -p results/seaport-native-refund
          printf 'RUNNER_OK\n' > results/seaport-native-refund/status.txt
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/seaport-native-refund/status.txt
          git commit -m 'Record Seaport runner probe' || exit 0
          git push
