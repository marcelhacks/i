name: Seaport all-live Captain owner scan

on:
  push:
    branches:
      - research/seaport-golden-p1
    paths:
      - .github/workflows/seaport-all-live-captain-owner-scan.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4
      - name: Probe every LIVE section in latest.txt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python3 - <<'PY'
          import concurrent.futures, json, re, subprocess, urllib.request
          from pathlib import Path

          text = Path('results/seaport-cross-chain-state/latest.txt').read_text()
          sections = []
          for raw in re.split(r'\n\s*\n(?=chain=)', text):
              row = {}
              for line in raw.splitlines():
                  if '=' in line:
                      k, v = line.split('=', 1)
                      row[k.strip()] = v.strip()
              if row.get('status') == 'LIVE' and row.get('captain_owner', '').startswith('0x'):
                  sections.append(row)

          FALLBACK = {
            1:['https://ethereum-rpc.publicnode.com','https://rpc.flashbots.net'],
            10:['https://optimism-rpc.publicnode.com'], 56:['https://bsc-rpc.publicnode.com'],
            97:['https://data-seed-prebsc-1-s1.bnbchain.org:8545'], 100:['https://gnosis-rpc.publicnode.com'],
            130:['https://mainnet.unichain.org'], 137:['https://polygon-bor-rpc.publicnode.com'],
            360:['https://mainnet.shape.network'], 369:['https://rpc.pulsechain.com'],
            545:['https://testnet.evm.nodes.onflow.org'], 747:['https://mainnet.evm.nodes.onflow.org'],
            943:['https://rpc.v4.testnet.pulsechain.com'], 1284:['https://rpc.api.moonbeam.network'],
            1285:['https://rpc.api.moonriver.moonbeam.network'], 1328:['https://evm-rpc-testnet.sei-apis.com'],
            1329:['https://evm-rpc.sei-apis.com'], 1727:['https://rpc01.ethpar.net/'],
            1868:['https://rpc.soneium.org'], 2020:['https://api.roninchain.com/rpc'],
            5000:['https://rpc.mantle.xyz'], 8217:['https://public-en.node.kaia.io'],
            8333:['https://mainnet-rpc.b3.fun'], 8453:['https://base-rpc.publicnode.com'],
            33111:['https://rpc.curtis.apechain.com'], 33139:['https://rpc.apechain.com'],
            34443:['https://mainnet.mode.network'], 42161:['https://arbitrum-one-rpc.publicnode.com'],
            42170:['https://arbitrum-nova-rpc.publicnode.com'],
            43113:['https://api.avax-test.network/ext/bc/C/rpc'],
            43114:['https://avalanche-c-chain-rpc.publicnode.com'],
            49321:['https://rpc.gunz.dev/ext/bc/ryk9vkvNuKtewME2PeCgybo9sdWXGmCkBrrx4VPuZPdVdAak8/rpc'],
            59144:['https://rpc.linea.build'], 80002:['https://polygon-amoy-bor-rpc.publicnode.com'],
            80094:['https://rpc.berachain.com'], 81457:['https://blast-rpc.publicnode.com'],
            84532:['https://sepolia.base.org'], 202601:['https://saigon-testnet.roninchain.com/rpc'],
            421614:['https://sepolia-rollup.arbitrum.io/rpc'], 534352:['https://rpc.scroll.io'],
            713715:['https://evm-rpc-arctic-1.sei-apis.com'], 7777777:['https://rpc.zora.energy'],
            11155111:['https://rpc.sepolia.org'], 11155420:['https://sepolia.optimism.io'],
            168587773:['https://sepolia.blast.io'], 999999999:['https://sepolia.rpc.zora.energy']
          }

          def fetch_json(url, timeout=25):
              req=urllib.request.Request(url,headers={'User-Agent':'seaport-all-owner-scan/1.0'})
              with urllib.request.urlopen(req,timeout=timeout) as r: return json.loads(r.read())
          try: chainlist=fetch_json('https://chainid.network/chains.json')
          except Exception: chainlist=[]
          endpoints={}
          for ch in chainlist:
              try: cid=int(ch['chainId'])
              except Exception: continue
              for x in ch.get('rpc') or []:
                  if isinstance(x,dict): x=x.get('url')
                  if isinstance(x,str) and x.startswith('https://') and not any(c in x for c in ('${','{','}','<','>')):
                      endpoints.setdefault(cid,[]).append(x)
          for cid, vals in FALLBACK.items():
              endpoints[cid]=list(dict.fromkeys(vals+endpoints.get(cid,[])))

          def rpc(url, method, params, timeout=10):
              req=urllib.request.Request(url,data=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode(),headers={'content-type':'application/json','user-agent':'seaport-all-owner-scan/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r: obj=json.loads(r.read())
                  return obj.get('result')
              except Exception: return None
          def choose(cid):
              for url in endpoints.get(cid,[])[:10]:
                  x=rpc(url,'eth_chainId',[],7)
                  try:
                      if int(x,16)==cid: return url
                  except Exception: pass
              return None
          def sig(s): return subprocess.check_output(['cast','sig',s],text=True).strip()
          S={x:sig(x) for x in ['masterCopy()','getOwners()','getThreshold()','owner()','initialized()','isInitialized()','implementation()','proxiableUUID()']}
          def call(url,to,data): return rpc(url,'eth_call',[{'to':to,'data':data},'latest'])
          def addr(x): return ('0x'+x[-40:]).lower() if isinstance(x,str) and x.startswith('0x') and len(x)>=42 else None
          def uint(x):
              try: return int(x,16)
              except Exception: return None
          def arrlen(x):
              try:
                  b=x[2:]; p=int(b[:64],16)*2; return int(b[p:p+64],16)
              except Exception: return None
          def scan(r):
              cid=int(r['chain_id']); own=r['captain_owner']; url=choose(cid)
              out={'chain':r.get('chain'),'chain_id':cid,'captain':r.get('owner'),'captain_owner':own,'rpc':url}
              if not url: out['classification']='NO_RPC'; return out
              code=rpc(url,'eth_getCode',[own,'latest'])
              out['code_size']=(len(code)-2)//2 if isinstance(code,str) and len(code)>4 else 0
              out['nonce']=uint(rpc(url,'eth_getTransactionCount',[own,'latest']))
              if out['code_size']==0: out['classification']='NO_CODE'; return out
              out['codehash']=subprocess.check_output(['cast','keccak',code],text=True).strip()
              calls={k:call(url,own,v) for k,v in S.items()}
              out['master_copy']=addr(calls['masterCopy()'])
              out['owners']=arrlen(calls['getOwners()'])
              out['threshold']=uint(calls['getThreshold()'])
              out['owner']=addr(calls['owner()'])
              out['initialized']=uint(calls['initialized()'])
              out['is_initialized']=uint(calls['isInitialized()'])
              out['implementation']=addr(calls['implementation()'])
              if out['master_copy']:
                  out['classification']='SAFE_INITIALIZED' if (out['owners'] or 0)>0 and (out['threshold'] or 0)>0 else 'SAFE_UNINITIALIZED'
              elif out['owner'] and out['owner'] != '0x'+'0'*40: out['classification']='OWNABLE_INITIALIZED'
              elif out['initialized'] or out['is_initialized']: out['classification']='FLAG_INITIALIZED'
              elif out['implementation']: out['classification']='PROXY_UNKNOWN'
              else: out['classification']='UNKNOWN_CONTRACT'
              return out

          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=18) as ex:
              for x in ex.map(scan,sections): results.append(x)
          results.sort(key=lambda r:r.get('chain_id',0))
          suspects=[r for r in results if r.get('classification') not in ('SAFE_INITIALIZED','OWNABLE_INITIALIZED','FLAG_INITIALIZED')]
          Path('output/results.json').write_text(json.dumps(results,indent=2,sort_keys=True)+'\n')
          Path('output/suspects.json').write_text(json.dumps(suspects,indent=2,sort_keys=True)+'\n')
          lines=[f"{r.get('chain')} ({r.get('chain_id')}): {r.get('classification')} captain={r.get('captain')} owner={r.get('captain_owner')} code={r.get('code_size')} safe={r.get('owners')}/{r.get('threshold')} ownable={r.get('owner')}" for r in results]
          Path('output/SUMMARY.txt').write_text('\n'.join(lines)+'\n')
          Path('output/VERDICT.txt').write_text(('SUSPECTS_FOUND' if suspects else 'ALL_INITIALIZED')+'\n')
          print('\n'.join(lines)); print('TOTAL',len(results),'SUSPECTS',len(suspects))
          PY
          sha256sum output/* > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seaport-all-live-captain-owner-${{ github.run_id }}
          path: output
          if-no-files-found: error
